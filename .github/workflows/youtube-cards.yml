name: Update YouTube cards

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: youtube-cards
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'eval-exec/neomacs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Update latest videos
        uses: DenverCoder1/github-readme-youtube-cards@a02c9b2b841c1cae3e8651571c0146a627423dc1
        with:
          channel_id: UCKNaV8uOpx0KgVt-Rw3AvFA
          max_videos: 3
          max_title_lines: 2
          output_type: html
          theme_context_light: '{"background_color":"#ffffff","title_color":"#24292f","stats_color":"#57606a"}'
          theme_context_dark: '{"background_color":"#0d1117","title_color":"#ffffff","stats_color":"#dedede"}'
